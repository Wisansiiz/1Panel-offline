name: Build Offline Edition

env:
  OFFLINE_VERSION: "2.0.4"

on:
  push:
    branches:
      - dev-v2
    tags:
      - "offline-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version, for example 2.0.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: offline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve bundle version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="${OFFLINE_VERSION}"
          fi

          version="${version#offline-v}"
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid offline version: ${version}; expected x.y.z" >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify offline network policy
        run: |
          ./offline/check-public-network.sh
          test ! -e frontend/src/routers/modules/ai.ts
          test ! -e agent/router/ro_ai.go
          ! grep -q 'AIToolsRouter' agent/router/common.go
          grep -q "if (isOffline)" frontend/src/utils/runtime-app-resource.ts
          grep -q "return 'remote'" frontend/src/utils/runtime-app-resource.ts

      - name: Build ${{ matrix.arch }} offline bundle
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./offline/build-bundle.sh "${{ matrix.arch }}"

      - name: Validate offline bundle
        shell: bash
        run: |
          bundle="dist/offline/1panel-offline-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          test -x "${bundle}/bin/1panel-core"
          test -x "${bundle}/bin/1panel-agent"
          test -x "${bundle}/runtime/docker/docker"
          test -x "${bundle}/runtime/docker/dockerd"
          test -x "${bundle}/runtime/docker/containerd"
          test -x "${bundle}/runtime/docker/runc"
          test -x "${bundle}/runtime/cli-plugins/docker-compose"
          ! grep -Rqs '/ai/agents' core/cmd/server/web/assets/js
          ! grep -Rqs '/ai/model/account' core/cmd/server/web/assets/js
          test -x "${bundle}/uninstall.sh"
          "${bundle}/uninstall.sh" --help >/dev/null
          test -s "${bundle}/images/images.tar"
          test "$(cat "${bundle}/images/images.txt")" = "1panel/openresty:1.27.1.2-2-3-focal"
          test -s "${bundle}/appstore-data.yaml"
          test -f "${bundle}/catalog/openresty/1.27.1.2-2-3-focal/docker-compose.yml"
          test -f "${bundle}/catalog/openresty/1.27.1.2-2-3-focal/conf/ssl/root_ssl.conf"
          test -f "${bundle}/catalog/openresty/1.27.1.2-2-3-focal/conf/default/00.default.conf"
          test -f "${bundle}/catalog/openresty/1.27.1.2-2-3-focal/scripts/init.sh"
          test ! -d "${bundle}/catalog/openresty/1.27.1.2-2-3-focal/build"
          test ! -e "${bundle}/catalog/mysql"
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            "${bundle}/runtime/docker/docker" --version
            "${bundle}/runtime/docker/dockerd" --version
            "${bundle}/runtime/docker/containerd" --version
            "${bundle}/runtime/docker/runc" --version
            "${bundle}/runtime/cli-plugins/docker-compose" version
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-offline-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/offline/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  install-smoke:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64
          path: smoke

      - name: Extract bundle
        shell: bash
        run: |
          tar -xzf smoke/1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz -C smoke

      - name: Install with bundled Docker runtime
        shell: bash
        run: |
          sudo systemctl disable --now docker.socket docker.service containerd.service || true
          bundle="smoke/1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64"
          sudo env \
            FORCE_BUNDLED_DOCKER=1 \
            PANEL_USERNAME=offline-smoke \
            PANEL_PASSWORD=offline-smoke-password \
            PANEL_ENTRANCE=offline-smoke \
            PANEL_PORT=19999 \
            "${bundle}/install.sh"

      - name: Verify offline installation
        shell: bash
        run: |
          sleep 5
          sudo systemctl is-active --quiet containerd.service
          sudo systemctl is-active --quiet docker.service
          sudo systemctl is-active --quiet 1panel-offline-egress.service
          sudo systemctl is-active --quiet 1panel-agent.service
          sudo systemctl is-active --quiet 1panel-core.service
          sudo iptables -C DOCKER-USER -j 1PANEL-OFFLINE
          sudo iptables -C 1PANEL-OFFLINE -j REJECT
          curl -fsSI http://127.0.0.1:19999/offline-smoke \
            | grep -qi '^Content-Security-Policy:'
          sudo docker info
          sudo docker compose version
          sudo docker image inspect \
            1panel/openresty:1.27.1.2-2-3-focal >/dev/null
          test -f /opt/1panel/resource/apps/remote/openresty/1.27.1.2-2-3-focal/docker-compose.yml
          test -f /opt/1panel/resource/apps/remote/openresty/1.27.1.2-2-3-focal/conf/ssl/root_ssl.conf
          test ! -e /opt/1panel/resource/apps/remote/mysql
          test -f /opt/1panel/resource/offline/data.yaml

      - name: Verify preserved-data reinstall keeps the security entrance
        shell: bash
        run: |
          bundle="smoke/1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64"
          sudo 1panel-uninstall --yes --keep-data
          test -f /opt/1panel/db/core.db
          test -f /opt/1panel/offline-install.env
          sudo test -f /var/lib/1panel-offline/install.env
          test ! -e /usr/local/bin/1panel-core
          sudo systemctl is-active --quiet docker.service
          sudo env \
            PANEL_USERNAME=must-not-replace-existing \
            PANEL_PASSWORD=must-not-replace-existing \
            PANEL_ENTRANCE=must-not-replace-existing \
            PANEL_PORT=29999 \
            "${bundle}/install.sh"
          sleep 5
          sudo 1pctl user-info | grep -q '/offline-smoke '
          curl -fsSI http://127.0.0.1:19999/offline-smoke \
            | grep -qi '^Content-Security-Policy:'

      - name: Verify complete uninstall
        shell: bash
        run: |
          sudo 1panel-uninstall --yes
          test ! -e /opt/1panel
          test ! -e /etc/1panel
          sudo test ! -e /var/lib/1panel-offline/install.env
          test ! -e /var/lib/docker
          test ! -e /var/lib/containerd
          test ! -e /usr/local/bin/1panel-core
          test ! -e /usr/local/bin/1panel-agent
          test ! -e /usr/local/bin/dockerd
          test ! -e /usr/local/lib/docker/cli-plugins/docker-compose
          ! sudo systemctl is-active --quiet 1panel-core.service
          ! sudo systemctl is-active --quiet 1panel-agent.service
          ! sudo systemctl is-active --quiet docker.service

  app-bundles:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: mysql8
            version: 8.4.10
            arch: amd64
          - bundle: mysql8
            version: 8.4.10
            arch: arm64
          - bundle: mysql5
            version: 5.7.44
            arch: amd64
          - bundle: redis
            version: 7.4.9
            arch: amd64
          - bundle: redis
            version: 7.4.9
            arch: arm64
          - bundle: java8
            version: 1.8
            arch: amd64
          - bundle: java8
            version: 1.8
            arch: arm64
          - bundle: java17
            version: "17"
            arch: amd64
          - bundle: java17
            version: "17"
            arch: arm64
          # - bundle: java21
          #   version: "21"
          #   arch: amd64
          # - bundle: java21
          #   version: "21"
          #   arch: arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force

      - name: Build ${{ matrix.bundle }} ${{ matrix.arch }} import bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./offline/build-app-bundle.sh "${{ matrix.bundle }}" "${{ matrix.arch }}"

      - name: Validate import bundle
        shell: bash
        run: |
          bundle="dist/offline-apps/1panel-app-${{ matrix.bundle }}-${{ matrix.version }}-linux-${{ matrix.arch }}"
          test -f "${bundle}/MANIFEST"
          test -f "${bundle}/data.yaml"
          test -f "${bundle}/SHA256SUMS"
          test -f "${bundle}/apps/"*/data.yml
          test -f "${bundle}/apps/"*/"${{ matrix.version }}"/docker-compose.yml
          test -s "${bundle}/images/${{ matrix.bundle }}-${{ matrix.version }}-${{ matrix.arch }}.tar"
          (
            cd "${bundle}"
            sha256sum -c SHA256SUMS
          )

      - name: Upload import bundle
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-app-${{ matrix.bundle }}-${{ matrix.version }}-linux-${{ matrix.arch }}
          path: dist/offline-apps/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
      - install-smoke
      - app-bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 1panel-offline-${{ needs.prepare.outputs.version }}-linux-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: 1panel-app-*
          path: release
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          (
            cd release
            sha256sum ./*.tar.gz > SHA256SUMS
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: 1Panel 完整离线版 ${{ needs.prepare.outputs.version }}（非官方修改版）
          prerelease: false
          generate_release_notes: false
          body: |
            ## 版本定位

            这是基于 1Panel 社区版制作的**非官方完整离线修改版**，面向企业内网、
            离线机房及其他无法访问公网的环境。安装和运行期间不依赖互联网，
            不主动发送公网请求，并限制应用容器访问公网。

            AI 模块未包含在离线版中。

            ## 本版本改进

            - 修复 OpenResty 首次安装缺少 SSL 配置目录的问题。
            - 等待 MySQL 真正就绪后再显示连接信息，避免首次连接出现 socket 错误。
            - 修复 Java 等外部运行环境导入后不出现在运行环境列表的问题。
            - 默认卸载现在会完整清理 1Panel 数据及离线包安装的 Docker 运行时。
            - 保留数据重装时继续使用数据库中的原安全入口，避免入口地址不一致。
            - 记录离线导入镜像，使用系统原有 Docker 时也能准确清理 1Panel 资源。

            ## 包含内容

            基础离线包同时提供 `amd64` 和 `arm64` 版本，内含：

            - 1Panel Core 与 Agent（Agent 是面板后端服务，不是 AI Agent）
            - Docker Engine 29.6.0
            - containerd、runc 与 Docker Compose 2.40.3
            - OpenResty 1.27.1.2-2-3-focal 镜像及完整应用定义

            MySQL、Redis 和 Java 不放入基础包，可按需下载独立导入包：

            | 导入包 | 版本 | 架构 |
            | --- | --- | --- |
            | MySQL 8 | 8.4.10 | amd64、arm64 |
            | MySQL 5 | 5.7.44 | amd64 |
            | Redis | 7.4.9 | amd64、arm64 |
            | Java 8 | 1.8 | amd64、arm64 |
            | Java 17 | 17 | amd64、arm64 |

            ## 安装方法

            下载与服务器架构一致的基础包和 `SHA256SUMS`，校验后安装：

            ```bash
            sha256sum --ignore-missing -c SHA256SUMS
            tar -xzf 1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz
            cd 1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64
            sudo ./install.sh
            ```

            ARM64 服务器请将命令中的 `amd64` 替换为 `arm64`。目标系统需要 Linux、
            systemd 和 iptables 兼容包。

            导入可选应用包，以 Redis 为例：

            ```bash
            tar -xzf 1panel-app-redis-7.4.9-linux-amd64.tar.gz
            sudo 1panel-import-app ./1panel-app-redis-7.4.9-linux-amd64
            ```

            ## 卸载

            ```bash
            # 完整卸载，包括 1Panel 数据和离线包安装的 Docker
            sudo 1panel-uninstall

            # 暂时卸载程序，保留数据和 Docker 供稍后重装
            sudo 1panel-uninstall --keep-data
            ```

            安装前已经存在的系统 Docker 不会被卸载。所有发布附件的校验值均汇总在
            `SHA256SUMS` 中。
          files: |
            release/*.tar.gz
            release/SHA256SUMS
