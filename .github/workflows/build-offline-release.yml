name: Build Offline Edition

env:
  OFFLINE_VERSION: "2.0.1"

on:
  push:
    branches:
      - dev-v2
    tags:
      - "offline-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version, for example 2.0.1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: offline-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Resolve bundle version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            version="${{ inputs.version }}"
          else
            version="${OFFLINE_VERSION}"
          fi

          version="${version#offline-v}"
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid offline version: ${version}; expected x.y.z" >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: |
            agent/go.sum
            core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify offline network policy
        run: |
          ./offline/check-public-network.sh
          test ! -e frontend/src/routers/modules/ai.ts
          test ! -e agent/router/ro_ai.go
          ! grep -q 'AIToolsRouter' agent/router/common.go

      - name: Build ${{ matrix.arch }} offline bundle
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./offline/build-bundle.sh "${{ matrix.arch }}"

      - name: Validate offline bundle
        shell: bash
        run: |
          bundle="dist/offline/1panel-offline-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          test -x "${bundle}/bin/1panel-core"
          test -x "${bundle}/bin/1panel-agent"
          test -x "${bundle}/runtime/docker/docker"
          test -x "${bundle}/runtime/docker/dockerd"
          test -x "${bundle}/runtime/docker/containerd"
          test -x "${bundle}/runtime/docker/runc"
          test -x "${bundle}/runtime/cli-plugins/docker-compose"
          test -x "${bundle}/uninstall.sh"
          "${bundle}/uninstall.sh" --help >/dev/null
          test -s "${bundle}/images/images.tar"
          test "$(cat "${bundle}/images/images.txt")" = "1panel/openresty:1.27.1.2-2-3-focal"
          test -s "${bundle}/appstore-data.yaml"
          test -f "${bundle}/catalog/openresty/1.27.1.2-2-3-focal/docker-compose.yml"
          test ! -e "${bundle}/catalog/mysql"
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            "${bundle}/runtime/docker/docker" --version
            "${bundle}/runtime/docker/dockerd" --version
            "${bundle}/runtime/docker/containerd" --version
            "${bundle}/runtime/docker/runc" --version
            "${bundle}/runtime/cli-plugins/docker-compose" version
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-offline-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}
          path: dist/offline/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  install-smoke:
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64
          path: smoke

      - name: Extract bundle
        shell: bash
        run: |
          tar -xzf smoke/1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64.tar.gz -C smoke

      - name: Install with bundled Docker runtime
        shell: bash
        run: |
          sudo systemctl disable --now docker.socket docker.service containerd.service || true
          bundle="smoke/1panel-offline-${{ needs.prepare.outputs.version }}-linux-amd64"
          sudo env \
            FORCE_BUNDLED_DOCKER=1 \
            PANEL_USERNAME=offline-smoke \
            PANEL_PASSWORD=offline-smoke-password \
            PANEL_ENTRANCE=offline-smoke \
            PANEL_PORT=19999 \
            "${bundle}/install.sh"

      - name: Verify offline installation
        shell: bash
        run: |
          sleep 5
          sudo systemctl is-active --quiet containerd.service
          sudo systemctl is-active --quiet docker.service
          sudo systemctl is-active --quiet 1panel-offline-egress.service
          sudo systemctl is-active --quiet 1panel-agent.service
          sudo systemctl is-active --quiet 1panel-core.service
          sudo iptables -C DOCKER-USER -j 1PANEL-OFFLINE
          sudo iptables -C 1PANEL-OFFLINE -j REJECT
          curl -fsSI http://127.0.0.1:19999/offline-smoke \
            | grep -qi '^Content-Security-Policy:'
          sudo docker info
          sudo docker compose version
          sudo docker image inspect \
            1panel/openresty:1.27.1.2-2-3-focal >/dev/null
          test -f /opt/1panel/resource/apps/remote/openresty/1.27.1.2-2-3-focal/docker-compose.yml
          test ! -e /opt/1panel/resource/apps/remote/mysql
          test -f /opt/1panel/resource/offline/data.yaml

  app-bundles:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: mysql8
            version: 8.4.10
            arch: amd64
          - bundle: mysql8
            version: 8.4.10
            arch: arm64
          - bundle: mysql5
            version: 5.7.44
            arch: amd64
          - bundle: redis
            version: 7.4.9
            arch: amd64
          - bundle: redis
            version: 7.4.9
            arch: arm64
          - bundle: java8
            version: 1.8
            arch: amd64
          - bundle: java8
            version: 1.8
            arch: arm64
          - bundle: java17
            version: "17"
            arch: amd64
          - bundle: java17
            version: "17"
            arch: arm64
          # - bundle: java21
          #   version: "21"
          #   arch: amd64
          # - bundle: java21
          #   version: "21"
          #   arch: arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force

      - name: Build ${{ matrix.bundle }} ${{ matrix.arch }} import bundle
        run: ./offline/build-app-bundle.sh "${{ matrix.bundle }}" "${{ matrix.arch }}"

      - name: Validate import bundle
        shell: bash
        run: |
          bundle="dist/offline-apps/1panel-app-${{ matrix.bundle }}-${{ matrix.version }}-linux-${{ matrix.arch }}"
          test -f "${bundle}/MANIFEST"
          test -f "${bundle}/SHA256SUMS"
          test -f "${bundle}/apps/"*/data.yml
          test -f "${bundle}/apps/"*/"${{ matrix.version }}"/docker-compose.yml
          test -s "${bundle}/images/${{ matrix.bundle }}-${{ matrix.version }}-${{ matrix.arch }}.tar"
          (
            cd "${bundle}"
            sha256sum -c SHA256SUMS
          )

      - name: Upload import bundle
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-app-${{ matrix.bundle }}-${{ matrix.version }}-linux-${{ matrix.arch }}
          path: dist/offline-apps/*.tar.gz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
      - install-smoke
      - app-bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 1panel-offline-${{ needs.prepare.outputs.version }}-linux-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: 1panel-app-*
          path: release
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          (
            cd release
            sha256sum ./*.tar.gz > SHA256SUMS
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: 1Panel Offline ${{ needs.prepare.outputs.version }}
          prerelease: false
          generate_release_notes: true
          body: |
            非官方 1Panel 社区版离线修改版。

            包内包含 Docker Engine、containerd、runc、Docker Compose
            以及 OpenResty 基础镜像和对应应用定义。
            Release 同时提供 MySQL 8、MySQL 5、Redis、Java 8、
            Java 17的独立离线导入包。

            下载对应架构的 `.tar.gz` 文件后执行：

            ```bash
            sha256sum -c SHA256SUMS
            tar -xzf 1panel-offline-*-linux-amd64.tar.gz
            ```
          files: |
            release/*.tar.gz
            release/SHA256SUMS
